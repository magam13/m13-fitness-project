<text x="610.0" y="1195.0" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#111">ожидает синхронизации</text>
<text x="50" y="1320" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#111">Статус определяется по FR-10; при нуле отметок запрос завершается ошибкой до сохранения.</text>
<text x="50" y="1360" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#111">После восстановления связи очередь отправляется с тем же ID по NFR-07.</text>
